[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orderops-agent"
version = "2.0.0"
description = "Bounded tool-calling AI Agent API for e-commerce order triage and refunds with deterministic financial guardrails, HITL supervisor approval, SSE trace streaming, and trajectory evaluations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
ui = [
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orderops = ["ui/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["orderops", "scripts", "evals"]
